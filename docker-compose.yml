version: '3.8'

services:
  sentiment-app:
    build: .
    ports:
      - "80:5000"
    environment:
      - FLASK_ENV=production
      - FORCE_CPU=true
    volumes:
      - ./uploads:/app/uploads
      - ./cache:/app/.cache
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 6G
